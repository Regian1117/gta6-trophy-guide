<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1136, initial-scale=1">
  <title>Palm &amp; Coast Casebook — GTA VI PS5 Trophy Guide &amp; Tracker</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell">
    <header class="top-header">
      <div class="brand-group">
        <svg class="brand-mark" viewBox="0 0 28 28" width="24" height="24" aria-hidden="true">
          <path d="M14 2L24 6v7.5c0 6.3-4.3 11.4-10 12.9C8.3 24.9 4 19.8 4 13.5V6l10-4z" fill="#0F766E" stroke="#FCD34D" stroke-width="1.7"/>
          <path d="M9.4 14.2l3.2 3.2 6.3-6.4" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div class="brand-titles">
          <span class="brand-name">Palm &amp; Coast Casebook</span>
          <span class="brand-sub">GTA VI PS5 Trophy Guide &amp; Tracker</span>
        </div>
      </div>

      <div class="progress-pill" aria-label="Trophy progress breakdown">
        <span id="earned-count">0 / 55 earned</span>
        <span class="pill-dot">·</span>
        <span class="grade-split">1 Plat · 2 Gold · 6 Silver · 46 Bronze</span>
      </div>

      <div class="header-actions">
        <button id="spoiler-toggle" class="hdr-btn hdr-btn-shield" type="button">Spoiler Shield: ON (12 story hidden)</button>
        <button id="export-btn" class="hdr-btn" type="button">Export</button>
        <label class="hdr-btn import-label" for="import-input">Import
          <input id="import-input" type="file" accept="application/json">
        </label>
        <span id="save-indicator" class="save-badge">✓ Saved</span>
      </div>
    </header>

    <nav class="audit-nav-bar" aria-label="Views and citation audit">
      <div class="nav-tabs" role="tablist">
        <button class="nav-tab is-active" type="button" data-view="tracker" role="tab">Tracker</button>
        <button class="nav-tab" type="button" data-view="roadmap" role="tab">Platinum Roadmap</button>
        <button class="nav-tab" type="button" data-view="missables" role="tab">Missables &amp; Spoiler</button>
        <button class="nav-tab" type="button" data-view="sources" role="tab">Sources &amp; Export</button>
      </div>
      <div id="audit-strip" class="audit-strip"></div>
    </nav>

    <section id="route-inline" class="route-inline" aria-label="Platinum roadmap stage strip"></section>

    <main id="main-workspace" class="main-workspace"></main>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
